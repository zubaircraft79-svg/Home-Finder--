{% extends "base.html" %}
{% block title %}Register | HomeFinder{% endblock %}
{% block content %}
<section class="auth-shell">
  <form class="form-card" method="post">
    <h1>Create account</h1>
    <p class="subtle">Secure portal access with OTP simulation.</p>
    <label>Full name<input name="full_name" required></label>
    <label>Email<input type="email" name="email" required></label>
    <label>Password<input type="password" name="password" required></label>
    <label>Account type
      <select name="role">
        <option value="user">Buyer / renter</option>
        <option value="seller">Seller</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" name="gdpr_consent" required> I consent to demo processing under the privacy notice.</label>
    <button class="btn btn-primary full" type="submit">Register</button>
    <p class="subtle">Already have account? <a href="{{ url_for('auth.login') }}">Login</a></p>
  </form>
</section>
{% endblock %}
