{% extends "admin/_layout.html" %}
{% block dash %}
<h1>Viewing bookings</h1>
<div class="table-wrap"><table><tr><th>Property</th><th>User</th><th>Date</th><th>Status</th></tr>{% for b in bookings %}<tr><td>{{ b.property.title }}</td><td>{{ b.user.email }}</td><td>{{ b.preferred_date }} {{ b.preferred_time }}</td><td><form method="post"><input type="hidden" name="booking_id" value="{{ b.id }}"><select name="status"><option>pending</option><option {% if b.status == 'confirmed' %}selected{% endif %}>confirmed</option><option {% if b.status == 'cancelled' %}selected{% endif %}>cancelled</option></select><button>Update</button></form></td></tr>{% endfor %}</table></div>
{% endblock %}
