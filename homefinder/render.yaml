services:
  - type: web
    name: homefinder-portal
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SHOW_DEV_OTP
        value: true
      - key: AUTO_SEED
        value: true
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: PREFERRED_URL_SCHEME
        value: https
      - key: DATABASE_URL
        fromDatabase:
          name: homefinder-db
          property: connectionString

databases:
  - name: homefinder-db
    plan: free
